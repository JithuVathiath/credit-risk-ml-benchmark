[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-ml-benchmark"
version = "1.0.0"
description = "Temporal machine-learning benchmark for five-year SBA 7(a) loan charge-off risk."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jithu Vathiath Biju"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3.1",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
credit-risk-benchmark = "credit_risk_benchmark.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
benchmark = [
  "catboost>=1.2,<2",
  "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["credit_risk_benchmark"]

[tool.coverage.report]
fail_under = 30
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
